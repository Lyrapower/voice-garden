<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice Garden — audio-reactive particles in the browser</title>
    <meta name="description" content="A real-time, audio-reactive particle field: 50k–200k particles respond to your voice or music. Three.js + Web Audio, runs in the browser." />
    <meta name="theme-color" content="#0a0a0f" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0a0f'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%237a8fb8'/%3E%3Ccircle cx='16' cy='16' r='12' fill='none' stroke='%23b8a8c8' stroke-width='1.5' stroke-dasharray='2 3'/%3E%3C/svg%3E" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Voice Garden" />
    <meta property="og:description" content="Audio-reactive particle field in the browser (Three.js + Web Audio). Speak or play music and 100k particles respond." />
    <meta property="og:url" content="https://lyrapower.github.io/voice-garden/" />
    <meta property="og:image" content="https://lyrapower.github.io/voice-garden/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app-root">
      <header class="top-bar">
        <span class="title">Voice Garden</span>
        <a class="gh-star" href="https://github.com/Lyrapower/voice-garden" target="_blank" rel="noopener">★ Star on GitHub</a>
      </header>
      <canvas id="c"></canvas>
      <div id="memory-hall" class="memory-hall" aria-label="Memory corridor sessions"></div>
      <footer class="bottom-bar">
        <button type="button" id="btn-demo" class="btn-primary">▶ Play demo track</button>
        <button type="button" id="btn-mic" class="btn-mic">Mic on</button>
        <span id="rec-indicator" class="rec-indicator" hidden>Recording</span>
        <button type="button" id="btn-record" class="btn-record" hidden>Record session</button>
        <button type="button" id="btn-stop" class="btn-stop" hidden>Stop</button>
      </footer>
      <div id="latency-overlay" class="latency-overlay" aria-live="polite"></div>
      <div id="gui-mount" class="gui-mount" aria-label="Settings"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
